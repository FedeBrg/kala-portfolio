<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio | Kala Bandera</title>
<meta name="author" content="Kala Bandera">
<link rel="icon" href="data:,">
<meta name="description" content="Portfolio of Kala Bandera, presented as a stereo viewer reel.">
<style>
@font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/InstrumentSerif-Italic.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Reel Sans"; font-weight: 400; src: url("assets/fonts/LiberationSans-Regular.ttf") format("truetype"); font-display: block; }
@font-face { font-family: "Reel Sans"; font-weight: 700; src: url("assets/fonts/LiberationSans-Bold.ttf") format("truetype"); font-display: block; }
@font-face { font-family: "Reel Print"; font-weight: 700; src: url("assets/fonts/BarlowCondensed-Bold.ttf") format("truetype"); font-display: block; }
@font-face { font-family: "Reel Print"; font-weight: 600; src: url("assets/fonts/BarlowCondensed-SemiBold.ttf") format("truetype"); font-display: block; }
@font-face { font-family: "Reel Print"; font-weight: 500; src: url("assets/fonts/BarlowCondensed-Medium.ttf") format("truetype"); font-display: block; }

:root {
  --cream: #f1ebe0;
  --card: #5a4a3b;
  --card-dark: #3d3128;
  --ink: #2a211b;
  --sky: #eef0f4;
  --pink: #e6a6c8;
  --salmon: #ee8a6a;
  --orange: #f2a451;
  --spring: cubic-bezier(.2, 1.35, .35, 1);
  --soft: cubic-bezier(.22, 1, .36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { color: var(--cream); font-family: "Reel Print", "Arial Narrow", sans-serif; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }

/* ---------- landing ---------- */
.title-wrap {
  position: fixed; left: 0; right: 0; top: clamp(18px, 6.5vh, 72px);
  text-align: center; z-index: 5; pointer-events: none;
}
#title {
  margin: 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
  font-size: clamp(44px, 6.6vw, 108px); line-height: 1; letter-spacing: .005em;
  color: var(--cream);
  text-shadow: 0 0 40px rgba(255, 80, 40, .12);
  transition: opacity .32s var(--soft), transform .32s var(--soft), filter .32s ease;
}
#title.out { opacity: 0; transform: translateY(-10px); filter: blur(7px); }
#title.in { animation: title-in .7s var(--soft) both; }
@keyframes title-in { from { opacity: 0; transform: translateY(14px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
.hint {
  margin: 14px 0 0; font-family: "Reel Print", sans-serif; font-weight: 500;
  font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #77706a;
  transition: opacity .6s ease;
}
.counter { display: inline-block; min-width: 4.5em; }

.hero {
  --w: min(96vw, calc((100svh - clamp(120px, 21vh, 230px)) * 570 / 360), 1560px);
  --u: calc(var(--w) / 570);
  position: fixed; left: 50%; bottom: 0; width: var(--w); aspect-ratio: 570 / 360; background: #000; isolation: isolate;
  transform: translateX(-50%);
  opacity: 0; transition: opacity 1.1s ease;
}
body.ready .hero { opacity: 1; }
.hero > * { position: absolute; }
.hero img { display: block; user-select: none; -webkit-user-drag: none; }

.reel {
  /* reel PNG is 923px @3x  => 307.667 units, centred on reel centre */
  left: calc((287.5 - 153.8333) * var(--u)); top: calc((226 - 153.8333) * var(--u));
  width: calc(307.6667 * var(--u)); height: calc(307.6667 * var(--u));
  will-change: transform;
}
.reel > img.disc { position: absolute; inset: 0; width: 100%; height: 100%; }
.win {
  position: absolute; overflow: hidden;
  width: calc(35.6 * var(--u)); height: calc(39.2 * var(--u));
  border-radius: calc(4.6 * var(--u));
  background: #121014;
}
.win img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.9) contrast(1.05) saturate(.92) blur(.25px); }
.win::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
  box-shadow: inset 0 0 calc(2.4 * var(--u)) rgba(0,0,0,.75), inset 0 0 0 calc(.6 * var(--u)) rgba(0,0,0,.55);
  background: linear-gradient(155deg, rgba(255,255,255,.10), rgba(255,255,255,0) 40%, rgba(0,0,0,.18)); }
.shade {
  left: calc(131 * var(--u)); top: calc(69.3333 * var(--u));
  width: calc(312.6667 * var(--u)); height: calc(290.6667 * var(--u));
  mix-blend-mode: multiply; pointer-events: none;
}
.body { inset: 0; width: 100%; height: 100%; pointer-events: none; transition: filter .3s ease; }
.hero.hover-body .body { filter: brightness(1.05) saturate(1.03); }
.lever {
  left: calc(458 * var(--u)); top: calc(171 * var(--u)); width: calc(81 * var(--u)); height: calc(121 * var(--u));
  transform-origin: calc(20 * var(--u)) calc(105 * var(--u));
  pointer-events: none; will-change: transform;
}
.hit { background: none; border: 0; padding: 0; cursor: pointer; outline-offset: 4px; }
.hit:focus-visible { outline: 2px solid rgba(241,235,224,.6); }
#lever-hit { left: calc(462 * var(--u)); top: calc(170 * var(--u)); width: calc(78 * var(--u)); height: calc(112 * var(--u)); border-radius: 40% 40% 30% 30%; z-index: 4; }
#body-hit { left: calc(84 * var(--u)); top: calc(188 * var(--u)); width: calc(384 * var(--u)); height: calc(172 * var(--u)); border-radius: 6% 6% 0 0; z-index: 3; }
#reel-hit { left: calc(135 * var(--u)); top: calc(73 * var(--u)); width: calc(305 * var(--u)); height: calc(118 * var(--u)); border-radius: 50% 50% 0 0 / 100% 100% 0 0; z-index: 3; }

/* ---------- detail view ---------- */
.detail { position: fixed; inset: 0; z-index: 20; visibility: hidden; }
.detail.open { visibility: visible; }
.backdrop { position: absolute; inset: 0; background: radial-gradient(120% 90% at 30% 50%, rgba(30,24,20,.55), rgba(0,0,0,.88)); opacity: 0; transition: opacity .5s ease; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.detail.open .backdrop { opacity: 1; }

.dreel {
  --dh: min(104svh, 1240px);
  --du: calc(var(--dh) / 1072);
  position: absolute; left: 0; top: 50%;
  width: calc(561 * var(--du)); height: var(--dh);
  margin-top: calc(var(--dh) / -2);
  transform-origin: calc(21.94 * var(--du)) calc(531.27 * var(--du));
  /* rolling: translation and rotation are linked (distance = angle x radius) so the photo's cut edge never shows */
  transform: translateX(-105%) rotate(-66deg);
  transition: transform .95s var(--soft);
  filter: drop-shadow(10px 0 30px rgba(0,0,0,.55));
  will-change: transform;
}
.detail.open .dreel { transform: none; }
.dreel .spin { position: absolute; inset: 0; transform-origin: inherit; will-change: transform; }
.dreel img.card { position: absolute; inset: 0; width: 100%; height: 100%; }
.dslide { position: absolute; overflow: hidden; border-radius: calc(17 * var(--du)); background: #efe7ea; }
.dslide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .3s ease; }
.dslide::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
  box-shadow: inset 0 0 0 calc(1.2 * var(--du)) rgba(255,255,255,.35), inset 0 0 calc(6 * var(--du)) rgba(60,30,40,.35);
  background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,0) 45%); }
.dcap {
  position: absolute; width: calc(190 * var(--du));
  transform-origin: 50% 0; text-align: center;
  font-family: "Reel Print", sans-serif; font-weight: 700; color: rgba(22,17,14,.9);
  font-size: calc(23 * var(--du)); line-height: .98; letter-spacing: -.005em;
  filter: blur(.25px); transition: opacity .3s ease;
}
.dcap b { font-weight: 700; font-size: 1.25em; margin-right: .12em; }
.dlabel { position: absolute; left: calc(30 * var(--du)); top: calc(424 * var(--du)); width: calc(104 * var(--du));
  font-family: "Reel Print", sans-serif; color: rgba(22,17,14,.9); filter: blur(.25px); transition: opacity .3s ease; }
.dlabel .k { font-weight: 600; font-size: calc(15 * var(--du)); letter-spacing: .02em; }
.dlabel .t { font-weight: 700; font-size: calc(40 * var(--du)); line-height: .9; text-transform: uppercase; margin: calc(4 * var(--du)) 0 calc(14 * var(--du)); overflow-wrap: normal; word-break: normal; }
.dlabel .s { font-weight: 600; font-size: calc(11.5 * var(--du)); line-height: 1.05; margin-left: calc(30 * var(--du)); }
.dlabel .s strong { font-weight: 700; font-size: 1.15em; display: block; }
.dlabel .n { font-weight: 700; font-size: calc(26 * var(--du)); margin: calc(22 * var(--du)) 0 0 calc(6 * var(--du)); }
.detail.open .dreel.rollout { transform: translateX(-38%) rotate(-24deg); transition: transform .3s cubic-bezier(.5,0,.75,0); }
.dreel.swap .dcap, .dreel.swap .dlabel { opacity: 0; }
.dreel.swap .dslide img { opacity: .0; }

.lens {
  --size: min(84svh, 46vw, 760px);
  position: absolute; top: 50%; right: max(3vw, calc(50vw - 40px - var(--size)));
  width: var(--size); height: var(--size); margin-top: calc(var(--size) / -2);
  border-radius: 50%;
  transform: translateX(120%) scale(.96); opacity: 0;
  transition: transform .9s var(--soft) .06s, opacity .5s ease .06s;
  background:
    radial-gradient(circle at 50% 50%, transparent 0 61%, rgba(0,0,0,.35) 61.6%, transparent 63%),
    repeating-conic-gradient(from 0deg, rgba(255,255,255,.025) 0 1.5deg, rgba(0,0,0,.03) 1.5deg 3deg),
    radial-gradient(circle at 35% 28%, #77634f, #56463a 45%, #3b3027 100%);
  box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.12), inset 0 -6px 18px rgba(0,0,0,.4);
  padding: calc(var(--size) * .055);
}
.detail.open .lens { transform: none; opacity: 1; }
.glass {
  position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
  background:
    radial-gradient(circle at 30% 22%, rgba(255,255,255,.9), rgba(255,255,255,0) 38%),
    radial-gradient(circle at 70% 85%, rgba(230,166,200,.35), rgba(230,166,200,0) 45%),
    radial-gradient(circle at 50% 50%, #f4f5f8 0%, #e7e9ee 62%, #cfd2da 100%);
  box-shadow: inset 0 0 0 calc(var(--size) * .012) rgba(30,22,16,.55), inset 0 0 calc(var(--size) * .09) rgba(60,45,35,.35);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
}
.glass::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,.12) 100%); }
.lens-content { width: 72%; max-height: 74%; overflow: auto; text-align: center; scrollbar-width: none; transition: opacity .28s ease, transform .28s ease; }
.lens-content::-webkit-scrollbar { display: none; }
.lens-content.swap { opacity: 0; transform: translateY(8px); }
.eyebrow { margin: 0 0 .6em; font-weight: 600; font-size: calc(var(--size) * .019); letter-spacing: .24em; text-transform: uppercase; color: #9a5a6f; }
.lens h2 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: calc(var(--size) * .075); line-height: .98; color: #2b211a; }
.meta { display: flex; justify-content: center; flex-wrap: wrap; gap: .4em .9em; margin: 1em 0 1.1em; padding: 0; list-style: none;
  font-weight: 600; font-size: calc(var(--size) * .02); letter-spacing: .12em; text-transform: uppercase; color: #5b4a3c; }
.meta li { display: flex; align-items: center; gap: .9em; }
.meta li + li::before { content: ""; width: .38em; height: .38em; border-radius: 50%; background: var(--salmon); }
.tools { margin: -.3em 0 1em; font-family: "Reel Print", sans-serif; font-weight: 500; font-size: calc(var(--size) * .021); color: #7a6656; }
.desc { margin: 0 auto; max-width: 30em; font-family: "Instrument Serif", Georgia, serif; font-size: calc(var(--size) * .03); line-height: 1.32; color: #3a2e25; }
.lens-nav { display: flex; justify-content: center; gap: .7em; margin-top: 1.3em; }
.lens-nav button, .close {
  cursor: pointer; border: 1px solid rgba(58,46,37,.45); background: rgba(255,255,255,.45); color: #3a2e25;
  border-radius: 999px; padding: .55em 1.25em; font-weight: 600; font-size: calc(var(--size) * .02); letter-spacing: .16em; text-transform: uppercase;
  transition: background .2s ease, transform .2s var(--spring), border-color .2s ease;
}
.lens-nav button:hover { background: #fff; border-color: #3a2e25; transform: translateY(-1px); }
.lens-nav button:active { transform: translateY(1px) scale(.98); }
.close {
  position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); z-index: 3;
  font-size: 12px; color: var(--cream); background: rgba(20,16,13,.55); border-color: rgba(241,235,224,.3);
  opacity: 0; transform: translateY(-8px); transition: opacity .4s ease .3s, transform .4s var(--soft) .3s, background .2s;
}
.close:hover { background: rgba(60,48,38,.8); }
.detail.open .close { opacity: 1; transform: none; }
.close span { font-size: 1.3em; line-height: 0; vertical-align: -.08em; margin-left: .35em; }

/* ---------- responsive ---------- */
@media (max-aspect-ratio: 4/5) {
  .hero { --w: min(112vw, 760px); }
  .title-wrap { top: auto; bottom: calc(min(112vw, 760px) * 360 / 570 + 8svh); }
  #title { font-size: clamp(40px, 12vw, 84px); }
  .hint { font-size: 11px; letter-spacing: .16em; }
  .dreel { --dh: min(66svh, 128vw); top: 0; margin-top: calc(var(--dh) * -.12); }
  .lens {
    --size: 94vw; width: 94vw; height: auto; max-height: 58svh; top: auto; bottom: max(3vw, env(safe-area-inset-bottom)); right: 3vw; margin: 0;
    border-radius: 36px; padding: 10px;
  }
  .glass { border-radius: 28px; height: auto; max-height: calc(58svh - 20px); display: block; }
  .glass::after { border-radius: 28px; }
  .lens-content { width: auto; max-height: calc(58svh - 20px); padding: 22px 22px 20px; }
  .eyebrow { font-size: 11px; } .lens h2 { font-size: 34px; } .meta, .tools { font-size: 12px; } .desc { font-size: 17px; } .lens-nav button { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  .dreel { transform: none; opacity: 0; transition: opacity .2s linear !important; }
  .detail.open .dreel { opacity: 1; }
  .lens { transform: none; }
}

/* ---------- v4: printed text on the landing reel (HTML, so it follows the data) ---------- */
.rprint { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) rotate(var(--r, 0deg)); text-align: center; white-space: nowrap;
  font-family: "Reel Sans", Arial, Helvetica, sans-serif; color: rgba(34, 34, 40, .9); line-height: 1.08; filter: blur(.28px); pointer-events: none; }
.rcap b { display: block; font-weight: 700; font-size: calc(8.6 * var(--u)); }
.rcap span { display: block; font-weight: 400; font-size: calc(5.9 * var(--u)); }
.rl-title { font-weight: 700; font-size: calc(11.5 * var(--u)); }
.rl-name { font-weight: 700; font-size: calc(8.2 * var(--u)); }
.rl-small { font-weight: 400; font-size: calc(5.2 * var(--u)); line-height: 1.12; }
.rl-no { font-weight: 700; font-size: calc(6.4 * var(--u)); }
.rl-made { font-weight: 400; font-size: calc(5.4 * var(--u)); }
.win .cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: "Instrument Serif", Georgia, serif; font-style: italic; color: #f3ecde; line-height: 1; filter: brightness(.9); }
.win .cover.c0 { background: radial-gradient(circle at 50% 46%, #a5523f, #3a1a15 78%); font-size: calc(8.4 * var(--u)); }
.win .cover.c1 { background: radial-gradient(circle at 50% 46%, #5f5577, #1d1a24 78%); font-size: calc(11.5 * var(--u)); }
.win.empty img, .win.empty .cover { display: none; }
.win.empty::after { background: linear-gradient(155deg, rgba(255,255,255,.05), rgba(255,255,255,0) 40%); }

/* ---------- v4: detail reel paging, empty film, photo mode ---------- */
.dslide { cursor: zoom-in; pointer-events: auto; }
.dslide.empty { cursor: default; background: radial-gradient(120% 100% at 30% 20%, #3a302b, #1a1513 70%, #110d0c); }
.dslide.empty img { display: none; }
.dslide.empty::after { box-shadow: inset 0 0 0 calc(1 * var(--du)) rgba(0,0,0,.5), inset 0 0 calc(10 * var(--du)) rgba(0,0,0,.6); background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,0) 45%); }
.dslide:not(.empty):hover img { filter: brightness(1.06); }
.dpager { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 4;
  display: flex; align-items: center; gap: 6px; padding: 5px; border-radius: 999px; background: rgba(20,16,13,.72); border: 1px solid rgba(241,235,224,.22);
  font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--cream);
  opacity: 0; transform: translateY(8px); transition: opacity .4s ease .35s, transform .4s var(--soft) .35s; }
.detail.open .dpager { opacity: 1; transform: none; }
.dpager[hidden] { display: none; }
.dpager span { padding: 0 8px; min-width: 11.5em; text-align: center; }
.dpager button { cursor: pointer; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(241,235,224,.3); background: rgba(255,255,255,.06); font-size: 16px; line-height: 1; }
.dpager button:hover { background: rgba(255,255,255,.16); }
.photo { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: #1b1512; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
.lens.photo-mode .photo { opacity: 1; pointer-events: auto; }
.lens.photo-mode .lens-content { opacity: 0; pointer-events: none; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 calc(var(--size) * .09) rgba(20,12,8,.55); background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,0) 32%); }
.photo-bar { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); z-index: 2; display: flex; align-items: center; gap: 6px;
  max-width: 78%; padding: 5px; border-radius: 999px; background: rgba(20,16,13,.72); color: var(--cream);
  font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.photo-bar span { padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.photo-bar button { cursor: pointer; flex: none; height: 30px; min-width: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(241,235,224,.3); background: rgba(255,255,255,.06); }
.photo-bar button:hover { background: rgba(255,255,255,.16); }
.loading-note { position: fixed; inset: auto 0 45% 0; text-align: center; color: #6d665f; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
@media (max-aspect-ratio: 4/5) {
  .dpager { top: max(14px, env(safe-area-inset-top)); bottom: auto; left: auto; right: 110px; font-size: 11px; }
  .dpager span { min-width: 0; }
  .photo { border-radius: 28px; }
  .lens.photo-mode .glass { min-height: 46svh; }
}

body.shot *, body.shot *::before, body.shot *::after { transition: none !important; animation: none !important; }
</style>
</head>
<body>
  <header class="title-wrap">
    <h1 id="title" aria-live="polite">Portfolio</h1>
    <p class="hint" id="hint">Pull the lever &middot; Click the viewer to look inside</p>
  </header>

  <main class="hero" id="hero" aria-label="Portfolio viewer">
    <div class="reel" id="reel" aria-hidden="true"><img class="disc" src="assets/reel-landing.png" alt=""></div>
    <img class="shade" src="assets/reel-shade.jpg" alt="" aria-hidden="true">
    <img class="body" src="assets/viewer-body.png" alt="Red stereo viewer with a reel in the slot">
    <img class="lever" id="lever" src="assets/viewer-lever.png" alt="" aria-hidden="true">
    <button class="hit" id="reel-hit" type="button" aria-label="Advance the reel"></button>
    <button class="hit" id="body-hit" type="button" aria-label="Look inside: open project details"></button>
    <button class="hit" id="lever-hit" type="button" aria-label="Pull the lever: next project"></button>
  </main>

  <section class="detail" id="detail" aria-hidden="true" aria-label="Project details">
    <div class="backdrop" id="backdrop"></div>
    <div class="dreel" id="dreel" aria-hidden="true"><div class="spin" id="dspin"><img class="card" src="assets/reel-detail.png" alt=""></div></div>
    <div class="lens" id="lens"><div class="glass"><div class="lens-content" id="lens-content"></div>
      <div class="photo" id="photo"><img id="photo-img" alt=""><div class="photo-bar"><button type="button" id="photo-prev" aria-label="Previous image">&lsaquo;</button><span id="photo-cap"></span><button type="button" id="photo-next" aria-label="Next image">&rsaquo;</button><button type="button" id="photo-back">Info</button></div></div>
    </div></div>
    <div class="dpager" id="dpager" hidden><button type="button" id="page-prev" aria-label="Previous images">&lsaquo;</button><span id="page-label"></span><button type="button" id="page-next" aria-label="More images">&rsaquo;</button></div>
    <button class="close" id="close-btn" type="button">Close<span>&times;</span></button>
  </section>

<script>
"use strict";
// ================= geometry measured from the photos =================
// Landing: base units of the cropped viewer photo (570 x 360). Reel PNG is 923px @3x = 307.667 units.
const REEL = { half: 153.8333, ringR: 110.8, phase: 6.8, step: 360 / 14 };
const SLOTS = 7;                         // 7 stops on the physical reel, 2 windows each
const FRAME_STEP = 360 / SLOTS;          // one lever pull
// Detail: reel-closeup.jpg pixel units (561 x 1072)
const DGEO = {"cx": 21.94, "cy": 531.27, "R": 515.8, "slides": [{"x": -57.85, "y": 178.3, "polar": -12.74, "rad": 142.36, "tan": 127.93}, {"x": 112.85, "y": 180.99, "polar": 14.55, "rad": 142.36, "tan": 127.93}, {"x": 263.61, "y": 261.32, "polar": 41.84, "rad": 145.33, "tan": 130.05}, {"x": 361.3, "y": 401.83, "polar": 69.12, "rad": 144.97, "tan": 127.73}, {"x": 386.42, "y": 569.34, "polar": 95.96, "rad": 142.36, "tan": 125.58}, {"x": 336.04, "y": 731.27, "polar": 122.49, "rad": 142.36, "tan": 126.87}, {"x": 218.65, "y": 849.73, "polar": 148.3, "rad": 142.36, "tan": 128.97}, {"x": 63.98, "y": 906.32, "polar": 173.61, "rad": 142.36, "tan": 128.13}]};
const PAGE_SLOTS = [1, 2, 3, 4, 5, 6, 7, 8];   // fully visible slide windows (0 is off-screen)

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const params = new URLSearchParams(location.search);
const shot = params.get("shot");
if (shot) document.body.classList.add("shot");
const $ = (id) => document.getElementById(id);
const hero = $("hero"), reelEl = $("reel"), lever = $("lever"), titleEl = $("title"), hint = $("hint");
const detail = $("detail"), dreel = $("dreel"), dspin = $("dspin"), lensEl = $("lens"), lensContent = $("lens-content");
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mod = (n, m) => ((n % m) + m) % m;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// ================= data =================
let PROJECTS = [], SETTINGS = { owner_name: "Kala Bandera", site_title: "Portfolio" };
function normalise(data) {
  const s = Object.assign({}, SETTINGS, (data && data.settings) || {});
  const list = ((data && data.projects) || []).filter((p) => p && p.title).map((p) => ({
    title: String(p.title).trim(),
    year: p.year != null && p.year !== "" ? String(p.year) : "",
    discipline: p.discipline || "",
    tools: p.tools || "",
    description: p.description || "",
    images: (p.images || []).map((im) => typeof im === "string" ? { image: im, caption: "" } : { image: im && im.image, caption: (im && im.caption) || "" }).filter((im) => im.image)
  }));
  return { settings: s, projects: list };
}
async function getJSON(url) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(url + " " + r.status);
  return r.json();
}
async function loadData() {
  try {
    const [p, s] = await Promise.all([getJSON("content/projects.json"), getJSON("content/settings.json").catch(() => ({}))]);
    return normalise({ projects: p.projects, settings: s });
  } catch (err) {
    // file:// (opened by double-click) cannot fetch: use the snapshot in content/fallback.js
    await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "content/fallback.js"; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
    return normalise(window.PORTFOLIO_FALLBACK || {});
  }
}

// ================= springy motion =================
function Spring(apply, k, c) { this.x = 0; this.v = 0; this.t = 0; this.k = k; this.c = c; this.apply = apply; this.raf = 0; }
Spring.prototype.to = function (t, kick) {
  this.t = t; if (kick) this.v += kick;
  if (reduce || shot) { this.x = t; this.v = 0; this.apply(t); return; }
  if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(this.tick.bind(this)); }
};
Spring.prototype.tick = function (now) {
  let dt = Math.min(0.032, (now - this.last) / 1000); this.last = now;
  const steps = 4; dt /= steps;
  for (let i = 0; i < steps; i++) { const a = -this.k * (this.x - this.t) - this.c * this.v; this.v += a * dt; this.x += this.v * dt; }
  this.apply(this.x);
  if (Math.abs(this.x - this.t) < 0.01 && Math.abs(this.v) < 0.02) { this.x = this.t; this.apply(this.x); this.raf = 0; return; }
  this.raf = requestAnimationFrame(this.tick.bind(this));
};

// ================= landing reel (endless) =================
// The reel has 7 physical stops. The content is an endless sequence: [cover, project 1 ... project N, cover, project 1 ...].
// Each physical stop shows the logical frame closest to the current angle; a stop is re-filled only when it is
// 3.5 stops away from the front, i.e. at the bottom of the reel, hidden inside the viewer.
let pos = 0;                  // logical frame index (unbounded, both directions)
const slots = [];             // per physical stop: { wins: [el, el], cap: el, key }
const u = (n) => "calc(" + (+n).toFixed(3) + " * var(--u))";
function seqLen() { return PROJECTS.length + 1; }
function itemAt(k) { const i = mod(k, seqLen()); return i === 0 ? null : PROJECTS[i - 1]; }   // null = cover
function projectNo(k) { return mod(k, seqLen()); }
function initials(name) { return name.split(/\s+/).filter(Boolean).map((w) => w[0].toUpperCase() + ".").join("").slice(0, 6); }
function splitTitle(t) {
  const w = t.split(/\s+/);
  if (w.length < 2) return [t];
  let best = 1, bestDiff = 1e9;
  for (let i = 1; i < w.length; i++) { const d = Math.abs(w.slice(0, i).join(" ").length - w.slice(i).join(" ").length); if (d < bestDiff) { bestDiff = d; best = i; } }
  return [w.slice(0, best).join(" "), w.slice(best).join(" ")];
}
function addPrint(cls, html, x, y, rot) {
  const el = document.createElement("div");
  el.className = "rprint " + cls; el.innerHTML = html;
  el.style.left = u(REEL.half + x); el.style.top = u(REEL.half + y);
  el.style.setProperty("--r", (rot || 0).toFixed(2) + "deg");
  reelEl.appendChild(el); return el;
}
function polarXY(pol, r) { const a = pol * Math.PI / 180; return [Math.sin(a) * r, -Math.cos(a) * r]; }
function buildLandingReel() {
  for (let s = 0; s < SLOTS; s++) {
    const wins = [];
    for (let j = 0; j < 2; j++) {
      const pol = REEL.phase + (2 * s + j) * REEL.step;
      const [x, y] = polarXY(pol, REEL.ringR);
      const w = document.createElement("div");
      w.className = "win";
      w.style.left = u(REEL.half + x - 17.8); w.style.top = u(REEL.half + y - 19.6);
      w.style.transform = "rotate(" + pol.toFixed(2) + "deg)";
      const img = document.createElement("img"); img.alt = ""; img.decoding = "async";
      const cover = document.createElement("div"); cover.className = "cover c" + j;
      w.append(img, cover); reelEl.appendChild(w); wins.push(w);
    }
    const cpol = REEL.phase + 2 * s * REEL.step + REEL.step / 2;
    const [cx, cy] = polarXY(cpol, 77);
    const cap = addPrint("rcap", "", cx, cy, cpol);
    slots.push({ wins, cap, key: null });
  }
  // centre label (upright at rest, like the original reel) and the print seen through the light window
  const S = SETTINGS, name = esc(S.owner_name);
  addPrint("rl-title", esc(S.site_title || "Portfolio"), -3, -45, 0);
  addPrint("rl-name", name, -2, -33.5, 0);
  addPrint("rl-small", "Reel 1 &middot; " + PROJECTS.length + (PROJECTS.length === 1 ? " view" : " views") + "<br>&copy; " + new Date().getFullYear() + " " + name, -1, -22, 0);
  addPrint("rl-no", "No. " + String(PROJECTS.length).padStart(2, "0") + "26", 0, 31, 180);
  addPrint("rl-made", "Portfolio reel<br>Made for viewing", 0, 47, 180);
}
function fillSlot(sl, k, empty) {
  const key = empty ? "e" + k : k;
  if (sl.key === key) return;
  sl.key = key;
  const p = empty ? undefined : itemAt(k);
  sl.wins.forEach((w, j) => {
    const img = w.firstChild, cover = w.lastChild;
    w.classList.toggle("empty", !!empty);
    if (empty) { img.removeAttribute("src"); return; }
    if (p === null) {                                   // cover frame
      img.style.display = "none"; cover.style.display = "flex";
      cover.textContent = j === 0 ? (SETTINGS.site_title || "Portfolio") : initials(SETTINGS.owner_name);
    } else {
      cover.style.display = "none";
      const im = p.images[j];
      if (im) { img.style.display = ""; if (img.getAttribute("src") !== im.image) img.src = im.image; w.classList.remove("empty"); }
      else { img.style.display = "none"; img.removeAttribute("src"); w.classList.add("empty"); }
    }
  });
  if (empty) sl.cap.innerHTML = "";
  else if (p === null) sl.cap.innerHTML = "<b>00</b><span>Selected</span><span>work</span>";
  else sl.cap.innerHTML = "<b>P" + projectNo(k) + "</b>" + splitTitle(p.title).map((l) => "<span>" + esc(l) + "</span>").join("");
}
function updateSlots(c) {
  const L = seqLen(), base = Math.round(c);
  const a = Math.min(3, Math.floor((L - 1) / 2));      // with fewer than 7 frames, leave far windows blank instead of repeating
  for (let s = 0; s < SLOTS; s++) {
    const k = s + SLOTS * Math.round((c - s) / SLOTS);
    const d = k - base;
    fillSlot(slots[s], k, L < SLOTS && (d < -a || d > L - 1 - a));
  }
}
const reelSpring = new Spring((x) => {
  reelEl.style.transform = "rotate(" + x.toFixed(3) + "deg)";
  updateSlots(-x / FRAME_STEP);
}, 210, 15);
function pressLever() {
  if (reduce || shot) return;
  lever.animate([
    { transform: "rotate(0deg) translateY(0)" },
    { transform: "rotate(9deg) translateY(1.5%)", offset: .35, easing: "cubic-bezier(.3,0,.2,1)" },
    { transform: "rotate(-1.5deg)", offset: .7 },
    { transform: "rotate(0deg)" }
  ], { duration: 430, easing: "ease-out" });
}
function titleFor(k) { const p = itemAt(k); return p === null ? (SETTINGS.site_title || "Portfolio") : p.title; }
let titleTimer = 0;
function setTitle(text, animate) {
  clearTimeout(titleTimer);
  if (!animate || reduce || shot) { titleEl.textContent = text; titleEl.classList.remove("out", "in"); return; }
  titleEl.classList.remove("in"); titleEl.classList.add("out");
  titleTimer = setTimeout(() => { titleEl.textContent = text; titleEl.classList.remove("out"); void titleEl.offsetWidth; titleEl.classList.add("in"); }, 230);
}
function turnTo(newPos, withLever, kick) {
  const dir = Math.sign(newPos - pos) || 1;
  pos = newPos;
  if (withLever) pressLever();
  setTimeout(() => reelSpring.to(-pos * FRAME_STEP, kick == null ? -dir * 40 : kick), withLever && !reduce ? 60 : 0);
  setTitle(titleFor(pos), true);
  hint.style.opacity = itemAt(pos) === null ? "1" : ".55";
}
function step(dir, withLever) {
  if (detailOpen) { stepProject(dir); return; }
  turnTo(pos + dir, withLever);
}

// ================= detail view =================
let detailOpen = false, dPage = 0, photoIndex = -1;
const du = (n) => "calc(" + (+n).toFixed(2) + " * var(--du))";
let dSlides = [], dCaps = [], dLabel = null;
function buildDetailReel() {
  DGEO.slides.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "dslide empty";
    const w = s.rad + 4, h = s.tan + 4;
    el.style.left = du(s.x - w / 2); el.style.top = du(s.y - h / 2);
    el.style.width = du(w); el.style.height = du(h);
    el.style.transform = "rotate(" + (s.polar - 90).toFixed(2) + "deg)";
    const img = document.createElement("img"); img.alt = ""; img.decoding = "async";
    el.appendChild(img); dspin.appendChild(el);
    el.addEventListener("click", () => { const n = +el.dataset.n; if (n >= 0) showPhoto(n); });
    dSlides.push(el);
  });
  const capPos = [[28, 278], [82, 270], [134, 266], [181, 262]];   // one printed caption per pair of slides
  capPos.forEach(([pol, r]) => {
    const a = pol * Math.PI / 180;
    const c = document.createElement("div"); c.className = "dcap";
    c.style.left = du(DGEO.cx + Math.sin(a) * r); c.style.top = du(DGEO.cy - Math.cos(a) * r);
    c.style.transform = "translateX(-50%) rotate(" + pol + "deg)";
    c.style.pointerEvents = "none";
    dspin.appendChild(c); dCaps.push(c);
  });
  dLabel = document.createElement("div"); dLabel.className = "dlabel"; dLabel.style.pointerEvents = "none"; dspin.appendChild(dLabel);
}
function current() { const p = itemAt(pos); return p === null ? PROJECTS[0] : p; }
function pageCount(p) { return Math.max(1, Math.ceil(p.images.length / PAGE_SLOTS.length)); }
function fitLabelTitle() {
  const t = dLabel.querySelector(".t"); if (!t) return;
  let size = 36; t.style.fontSize = du(size);
  const maxW = dLabel.clientWidth;
  const words = t.textContent.split(/\s+/);
  const probe = document.createElement("span"); probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap"; t.appendChild(probe);
  while (size > 16) {
    let widest = 0;
    for (const w of words) { probe.textContent = w; widest = Math.max(widest, probe.getBoundingClientRect().width); }
    if (widest <= maxW * 0.96) break;
    size -= 2; t.style.fontSize = du(size);
  }
  probe.remove();
}
function fillReelPage() {
  const p = current(), per = PAGE_SLOTS.length;
  const pages = pageCount(p); dPage = mod(dPage, pages);
  const first = dPage * per, list = p.images.slice(first, first + per);
  const start = Math.floor((per - list.length) / 2);          // centre short pages on the visible arc
  const bySlot = {};
  list.forEach((im, i) => { bySlot[PAGE_SLOTS[start + i]] = first + i; });
  dSlides.forEach((el, si) => {
    const n = bySlot[si];
    const img = el.firstChild;
    if (n == null) { el.classList.add("empty"); el.dataset.n = -1; img.removeAttribute("src"); el.title = ""; }
    else { el.classList.remove("empty"); el.dataset.n = n; img.src = p.images[n].image; el.title = "Image " + (n + 1); }
  });
  dCaps.forEach((c, j) => {
    const cand = [PAGE_SLOTS[2 * j], PAGE_SLOTS[2 * j + 1]].map((si) => bySlot[si]).filter((n) => n != null);
    const withCap = cand.find((n) => p.images[n].caption) ;
    const n = withCap != null ? withCap : cand[0];
    c.innerHTML = n == null ? "" : "<b>" + (n + 1) + "</b>" + esc(p.images[n].caption || "");
  });
  const pager = $("dpager");
  pager.hidden = pages < 2;
  $("page-label").textContent = "Images " + (first + 1) + "\u2013" + (first + list.length) + " of " + p.images.length;
}
function fillDetail() {
  const p = current(), n = PROJECTS.indexOf(p) + 1, owner = SETTINGS.owner_name.toUpperCase();
  fillReelPage();
  dLabel.innerHTML = '<div class="k">' + esc(p.discipline.toUpperCase()) + '</div><div class="t">' + esc(p.title) + '</div>' +
    '<div class="s"><strong>&copy; ' + esc(p.year || new Date().getFullYear()) + " " + esc(owner) + '</strong>Portfolio reel, view ' + n + '<br>' + p.images.length + (p.images.length === 1 ? " image" : " images") + '<br>Made for viewing</div>' +
    '<div class="n">No. ' + String(n).padStart(2, "0") + '</div>';
  fitLabelTitle();
  if (document.fonts && document.fonts.load) document.fonts.load('700 36px "Reel Print"').then(() => requestAnimationFrame(fitLabelTitle)).catch(() => {});
  const meta = [p.discipline, p.year].filter(Boolean).map((m) => "<li>" + esc(m) + "</li>").join("");
  lensContent.innerHTML =
    '<p class="eyebrow">View ' + n + " of " + PROJECTS.length + "</p>" +
    "<h2>" + esc(p.title) + "</h2>" +
    (meta ? '<ul class="meta">' + meta + "</ul>" : '<div style="height:1em"></div>') +
    (p.tools ? '<p class="tools">' + esc(p.tools) + "</p>" : "") +
    '<p class="desc">' + esc(p.description) + "</p>" +
    '<div class="lens-nav"><button type="button" data-d="-1">Previous</button><button type="button" data-d="1">Next</button></div>';
  hidePhoto();
}
lensContent.addEventListener("click", (e) => { const b = e.target.closest("button[data-d]"); if (b) stepProject(+b.dataset.d); });

function showPhoto(n) {
  const p = current(); if (!p.images[n]) return;
  photoIndex = n;
  $("photo-img").src = p.images[n].image;
  $("photo-img").alt = p.images[n].caption || p.title + ", image " + (n + 1);
  $("photo-cap").textContent = (n + 1) + " / " + p.images.length + (p.images[n].caption ? "  \u00b7  " + p.images[n].caption : "");
  lensEl.classList.add("photo-mode");
}
function hidePhoto() { photoIndex = -1; lensEl.classList.remove("photo-mode"); }
function stepPhoto(d) {
  const p = current(), n = mod(photoIndex + d, p.images.length);
  const per = PAGE_SLOTS.length;
  if (Math.floor(n / per) !== dPage) { turnPage(Math.floor(n / per) - dPage, true); }
  showPhoto(n);
}
$("photo-prev").addEventListener("click", () => stepPhoto(-1));
$("photo-next").addEventListener("click", () => stepPhoto(1));
$("photo-back").addEventListener("click", hidePhoto);

let swapping = false;
async function rollSwap(update, alsoLens) {
  if (reduce || shot) { update(); return; }
  swapping = true;
  dreel.classList.add("swap", "rollout"); if (alsoLens) lensContent.classList.add("swap");
  await wait(310);
  update();
  dreel.classList.remove("rollout");
  await wait(120);
  dreel.classList.remove("swap"); lensContent.classList.remove("swap");
  await wait(260);
  swapping = false;
}
function turnPage(d, keepPhoto) {
  const p = current(); if (pageCount(p) < 2) return;
  const photo = photoIndex;
  dPage = mod(dPage + d, pageCount(p));
  if (keepPhoto) { fillReelPage(); return; }
  rollSwap(() => { fillReelPage(); if (photo >= 0) showPhoto(photo); }, false);
}
$("page-prev").addEventListener("click", () => turnPage(-1));
$("page-next").addEventListener("click", () => turnPage(1));

function stepProject(dir) {
  if (swapping) return;
  let k = pos + dir;
  if (itemAt(k) === null) k += dir;                // skip the cover inside the detail view
  pos = k; dPage = 0;
  reelSpring.to(-pos * FRAME_STEP);
  setTitle(titleFor(pos), true);
  rollSwap(fillDetail, true);
}
function openDetail() {
  if (detailOpen || !PROJECTS.length) return;
  if (itemAt(pos) === null) turnTo(pos + 1, true);
  detailOpen = true; dPage = 0;
  fillDetail();
  detail.setAttribute("aria-hidden", "false");
  const go = () => { detail.classList.add("open"); $("close-btn").focus({ preventScroll: true }); fitLabelTitle(); setTimeout(fitLabelTitle, 400); };
  if (shot || reduce) go(); else setTimeout(() => requestAnimationFrame(go), 120);
}
function closeDetail() {
  if (!detailOpen) return;
  detailOpen = false;
  detail.classList.remove("open");
  detail.setAttribute("aria-hidden", "true");
  $("body-hit").focus({ preventScroll: true });
}

// ================= input =================
function bindInput() {
  $("lever-hit").addEventListener("click", () => step(1, true));
  $("reel-hit").addEventListener("click", () => step(1, false));
  $("body-hit").addEventListener("click", openDetail);
  $("body-hit").addEventListener("pointerenter", () => hero.classList.add("hover-body"));
  $("body-hit").addEventListener("pointerleave", () => hero.classList.remove("hover-body"));
  $("close-btn").addEventListener("click", closeDetail);
  $("backdrop").addEventListener("click", closeDetail);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (photoIndex >= 0) hidePhoto(); else closeDetail(); return; }
    if (detailOpen && photoIndex >= 0 && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); stepPhoto(e.key === "ArrowRight" ? 1 : -1); return; }
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); step(1, true); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); step(-1, false); }
  });
  let wheelLock = 0;
  addEventListener("wheel", (e) => {
    if (detailOpen && e.target.closest && e.target.closest(".lens-content") && lensContent.scrollHeight > lensContent.clientHeight + 4) return;
    e.preventDefault();
    const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (Math.abs(d) < 6 || performance.now() < wheelLock) return;
    wheelLock = performance.now() + 650;
    if (detailOpen && e.target.closest && e.target.closest("#dreel") && pageCount(current()) > 1) { turnPage(d > 0 ? 1 : -1); return; }
    step(d > 0 ? 1 : -1, d > 0);
  }, { passive: false });
  let tStart = null;
  addEventListener("touchstart", (e) => { const t = e.changedTouches[0]; tStart = { x: t.clientX, y: t.clientY, reel: !!(e.target.closest && e.target.closest("#dreel")) }; }, { passive: true });
  addEventListener("touchend", (e) => {
    if (!tStart) return; const t = e.changedTouches[0];
    const dx = t.clientX - tStart.x, dy = t.clientY - tStart.y, onReel = tStart.reel; tStart = null;
    if (detailOpen && onReel && Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 40 && pageCount(current()) > 1) { turnPage(dy < 0 ? 1 : -1); return; }
    const big = Math.abs(dx) > Math.abs(dy) ? dx : (detailOpen ? 0 : dy);
    if (Math.abs(big) < 40) return;
    step(big < 0 ? 1 : -1, big < 0);
  });
}

// ================= start =================
(async function init() {
  if (matchMedia("(pointer: coarse)").matches) hint.innerHTML = "Pull the lever or swipe &middot; Tap the viewer to look inside";
  const data = await loadData();
  PROJECTS = data.projects; SETTINGS = data.settings;
  document.title = (SETTINGS.site_title || "Portfolio") + " | " + SETTINGS.owner_name;
  document.querySelector('meta[name="author"]').content = SETTINGS.owner_name;
  buildLandingReel(); buildDetailReel(); bindInput();
  addEventListener("resize", () => { if (detailOpen) fitLabelTitle(); });
  if (shot) {
    const f = +(params.get("f") || (shot === "advanced" ? 2 : shot === "detail" ? 1 : 0));
    pos = f; reelSpring.to(-pos * FRAME_STEP); setTitle(titleFor(pos), false);
    document.body.classList.add("ready");
    if (shot === "detail") { openDetail(); if (params.get("page")) { turnPage(+params.get("page")); } if (params.get("photo")) showPhoto(+params.get("photo")); }
    document.body.dataset.ready = "1";
    return;
  }
  setTitle(titleFor(0), false);
  updateSlots(0);
  const start = () => {
    document.body.classList.add("ready");
    if (!reduce) {                                   // intro: the reel clicks into place
      reelSpring.x = FRAME_STEP; reelSpring.apply(reelSpring.x);
      setTimeout(() => { reelSpring.to(0, -60); pressLever(); }, 650);
    }
    document.body.dataset.ready = "1";
  };
  if (document.readyState === "complete") start(); else addEventListener("load", start);
})();
</script>
